config_version = 14

[bar.default]
center = [ "taskbar" ]
end = [
    "media",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
margin_ends = 0
radius = 0
start = [ "launcher", "niri_button", "workspaces", "clock", "active_window", "group:g1" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = false
    fill = "surface_variant"
    id = "g1"
    members = [ "cpu", "temp", "ram", "GPU", "GPU_VRAM", "network_rx", "network_tx" ]
    opacity = 1.0
    padding = 6.0

[calendar]
enabled = true

    [calendar.account.personal_google]
    type = "google"

[dock]
layer = "overlay"
smart_auto_hide = true

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1418.0
    output = "eDP-2"
    placement_height = 1600.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[shell]
niri_overview_type_to_launch_enabled = true

[theme]
builtin = "Tokyo-Night"

[wallpaper.default]
path = "/nix/store/yjlbxpm2k7dcp8lnmr5r2vjlb4vbb7bp-noctalia-5.0.1/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/nix/store/yjlbxpm2k7dcp8lnmr5r2vjlb4vbb7bp-noctalia-5.0.1/share/noctalia/assets/noctalia-wallpaper.png"

[widget.GPU]
stat = "gpu_usage"
type = "sysmon"

[widget.GPU_VRAM]
stat = "gpu_vram_used"
type = "sysmon"

[widget.active_window]
enabled = false

[widget.launcher]
glyph = "rocket"

[widget.niri_button]
glyph = "niri"
type = "custom_button"

    [widget.niri_button.actions]
    left = "exec niri msg action toggle-overview"

[widget.sysmon]
stat = "gpu_usage"

[widget.taskbar]
group_by_workspace = true
icon_scale = 1.5000000000000002

[widget.tray]
enabled = false

[widget.workspaces]
enabled = false